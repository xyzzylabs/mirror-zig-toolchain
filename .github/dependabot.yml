version: 2
updates:
  # Actions used by this repo's workflows. They are pinned by commit SHA;
  # Dependabot rewrites the SHA and its trailing version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
    commit-message:
      # CI-only changes don't affect the published action, so no release.
      prefix: ci
      include: scope
    labels: [dependencies, ci]
